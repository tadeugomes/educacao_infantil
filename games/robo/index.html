<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo do robô no bairro</title>
<style>
  @font-face { font-family: Andika; src: url("../../assets/fonts/andika-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: Andika; src: url("../../assets/fonts/andika-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --azul: #21409a; --amarelo: #ffb703; --verde: #1f8a70; --coral: #e4572e; --papel: #fffaf0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Andika, system-ui, sans-serif; background: var(--papel); color: #1d2433; font-size: 17px;
         -webkit-tap-highlight-color: transparent; user-select: none; }
  #app { display: grid; gap: 10px; padding: 10px; height: 100%; grid-template-rows: auto 1fr auto auto; }
  @media (orientation: landscape) and (min-width: 640px) {
    #app { grid-template-columns: 1.2fr 1fr; grid-template-rows: auto 1fr auto; }
    #topo { grid-column: 1 / 3; }
    #mapa { grid-row: 2 / 4; }
  }
  #topo h1 { font-size: 1.15rem; margin: 0; color: var(--azul); }
  #topo p { margin: .2rem 0 0; }
  #fases { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  #mapa { width: 100%; height: 100%; min-height: 200px; }
  button { min-height: 48px; min-width: 48px; border-radius: 14px; border: 3px solid var(--azul); background: #fff;
           color: var(--azul); font: inherit; font-weight: 700; padding: 4px 12px; touch-action: manipulation; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.primario { background: var(--azul); color: #fff; }
  button.atual { background: var(--amarelo); border-color: var(--amarelo); color: #1d2433; }
  button.feita { border-color: var(--verde); color: var(--verde); }
  button[disabled] { opacity: .45; }
  #paleta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  #programa { display: flex; gap: 6px; flex-wrap: wrap; min-height: 56px; padding: 6px; background: #fff;
              border: 2px dashed #c9d3ea; border-radius: 14px; align-content: flex-start; }
  #programa button { border-width: 2px; font-size: .85rem; min-height: 40px; min-width: 40px; padding: 2px 8px; }
  @media (orientation: portrait) { #mapa { max-height: 38vh; } }
  #programa button.rodando { background: var(--amarelo); border-color: var(--amarelo); color: #1d2433; }
  #msg { min-height: 2.6em; font-weight: 700; margin: 4px 0; }
  #msg.certo { color: var(--verde); } #msg.errado { color: var(--coral); }
  .rot { font-size: .85rem; color: #555; margin: 2px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="topo">
    <h1 id="titulo"></h1>
    <p id="pedido"></p>
    <div id="fases" role="group" aria-label="Fases"></div>
  </div>
  <svg id="mapa" role="img" aria-label="Mapa do bairro em quadradinhos"></svg>
  <div>
    <p class="rot">Toque nos blocos para montar o caminho.</p>
    <div id="paleta"></div>
    <p class="rot">Seu programa (toque para tirar):</p>
    <div id="programa" aria-live="polite"></div>
  </div>
  <div>
    <div id="acoes">
      <button id="executar" class="primario">Executar</button>
      <button id="limpar">Limpar</button>
      <button id="voltar">Voltar ao início</button>
    </div>
    <div id="msg" aria-live="polite"></div>
  </div>
</div>
<script type="module" src="robo.js"></script>
</body>
</html>
