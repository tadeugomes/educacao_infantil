# Compila os dois perfis e publica no GitHub Pages.
#
# Resultado:
#   /                 página de entrada (pages/index.html)
#   /aluno/           versão da criança, instalável (PWA)
#   /professor/       versão do professor
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy oficial do Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      # Os scripts de pré e pós-compilação usam só a biblioteca padrão.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/configure-pages@v5

      # Quando todos os módulos estiverem prontos, BNCC_ESTRITO=1 aqui faz a
      # compilação falhar se alguma habilidade ficar sem prática e avaliação.
      - name: Compilar a versão da criança
        run: quarto render --profile aluno

      - name: Compilar a versão do professor
        run: quarto render --profile professor

      - name: Página de entrada
        run: cp pages/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
